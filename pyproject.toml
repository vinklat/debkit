[project]
name = "debkit"
version = "0.1.0"
description = "Build, mirror, and verify Debian package repositories on filesystem, S3, and HTTP storage."
authors = [{name = "Václav Vinklát"}]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.13"
keywords = ["debian", "apt", "repository", "mirror", "deb", "s3", "gpg"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Archiving :: Mirroring",
    "Topic :: System :: Software Distribution",
]
# Lower bounds track Debian testing → SETUP.md#dependency-policy.
dependencies = [
    "txstore>=0.1.1,<0.2",
    "python-debian>=1.0.1,<2",
    "python-gnupg>=0.5.5,<0.6",
    "humanize>=4.14.0,<5",
    "urllib3>=2.7.0,<3",
]

[project.scripts]
debkit = "debkit.cli:main"

[project.urls]
Homepage = "https://github.com/vinklat/debkit"
Source = "https://github.com/vinklat/debkit"
Issues = "https://github.com/vinklat/debkit/issues"
Documentation = "https://github.com/vinklat/debkit/blob/main/docs/guides/README.md"
Changelog = "https://github.com/vinklat/debkit/blob/main/SETUP.md#upgrade-notes"

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10",
    "pytest-cov>=7.1.0,<8",
    "ruff>=0.15.11,<1",
    "mypy>=1.20.1,<2",
    "moto[s3,server]>=5.1,<6",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "DTZ", # flake8-datetimez
    "D",   # pydocstyle — Google-style docstrings
    "PT",  # flake8-pytest-style
    "LOG", # flake8-logging: module loggers, never the root logger
    "G",   # flake8-logging-format: %-style lazy arguments
    "ERA", # eradicate: no commented-out code
    "FIX", # flake8-fixme: no TODO/FIXME/XXX/HACK; deviations go to ROADMAP.md
    "PLC0415", # import-outside-toplevel: local imports only for a named cycle or deferral
    "RUF100",  # unused noqa: every suppression names an enabled rule
]
ignore = [
    "D107",  # Missing docstring in __init__
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "PLC0415"]
"scripts/**" = ["D", "PLC0415"]

[tool.ruff.lint.isort]
known-first-party = ["debkit"]

[tool.mypy]
python_version = "3.13"
files = ["src/debkit", "tests", "scripts"]
mypy_path = ["src", "tests"]
explicit_package_bases = true
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
warn_unreachable = true

# python-gnupg ships no type information.
[[tool.mypy.overrides]]
module = ["gnupg"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-v --strict-markers"
# Non-default: an empty parametrize set fails collection instead of skipping → TESTING.md#harness-and-gates
empty_parameter_set_mark = "fail_at_collect"

[tool.coverage.run]
source = ["debkit"]
omit = ["*/tests/*"]
branch = true

[tool.coverage.report]
fail_under = 94
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/debkit"]

[tool.hatch.build.targets.sdist]
include = [
    "src/debkit",
    "tests",
    "docs",
    "scripts",
    "/*.md",
    "LICENSE",
    "pyproject.toml",
    "uv.lock",
]
